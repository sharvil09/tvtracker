<!doctype html>
<html lang="en"><head><base target="_top"><meta charset="utf-8"><title>WatchTogether</title>
<style>
:root{color-scheme:dark;--bg:#10110f;--panel:#1b1d18;--line:#32362b;--ink:#f2f4eb;--muted:#a6ad9a;--lime:#d7f580}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}button,input,select{font:inherit}button,a{touch-action:manipulation}button{border:1px solid var(--line);background:#262a20;color:var(--ink);border-radius:9px;padding:9px 13px;cursor:pointer}button:hover{border-color:var(--lime)}button:disabled{opacity:.5;cursor:wait}.primary{background:var(--lime);color:#17200a;border-color:var(--lime)}input,select{width:100%;padding:11px;background:#151711;color:var(--ink);border:1px solid var(--line);border-radius:9px}header{border-bottom:1px solid var(--line);padding:22px 5vw;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:23px;font-weight:800;letter-spacing:-1px}.brand span{color:var(--lime)}#account{font-size:13px;color:var(--muted)}main{max-width:1240px;margin:auto;padding:32px 5vw 80px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px}nav button.active{color:#17200a;background:var(--lime)}h1{font-size:clamp(27px,4vw,42px);letter-spacing:-1.5px;margin:0 0 5px}h2{margin-top:0}p{color:var(--muted)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}.card{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}.poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:#282c20}.placeholder{display:grid;place-items:center;font-size:38px;color:var(--muted)}.body{padding:17px}.body h2{font-size:18px;margin:0 0 6px}.meta{color:var(--muted);font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.actions button{font-size:13px}.tag{color:var(--lime)}.empty{padding:50px 24px;border:1px dashed var(--line);border-radius:14px;text-align:center}.search{display:flex;gap:10px;max-width:650px;margin-bottom:26px}.search input{min-width:0}.notice{padding:12px 16px;border:1px solid #586d2c;background:#26321a;border-radius:10px;margin-bottom:20px}.error{border-color:#a95858;background:#3b2020}.settings{max-width:600px}.field{margin:20px 0}.field label{display:block;margin-bottom:6px}.services{display:flex;gap:8px;flex-wrap:wrap}.services label{display:flex;align-items:center;gap:6px}.services input{width:auto}.release{display:flex;gap:20px;padding:20px;border-bottom:1px solid var(--line)}.release strong{color:var(--lime);min-width:95px}dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;width:min(550px,calc(100% - 32px));max-height:85vh;overflow:auto;padding:25px}dialog::backdrop{background:#000a}.close{float:right}.tier-buttons{display:flex;gap:10px;flex-wrap:wrap}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fineprint{font-size:12px;color:var(--muted)}.ranking{padding:10px 0;border-bottom:1px solid var(--line)}@media(max-width:550px){header{align-items:flex-start;flex-direction:column;gap:5px}main{padding-top:22px}.toolbar{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.body{padding:12px}.body h2{font-size:16px}.actions button{width:100%;padding:8px}.release{gap:12px;padding:15px 0}nav button{font-size:13px;padding:8px 10px}}
</style></head><body>
<header><div class="brand">Watch<span>Together</span></div><div id="account">Your next good watch.</div></header>
<main><nav aria-label="Library"><button data-tab="watching">Watching</button><button data-tab="want">Watchlist</button><button data-tab="done">Watched</button><button data-tab="dropped">Dropped</button><button data-tab="upcoming">Upcoming</button><button data-tab="search">Search</button><button data-tab="settings">Settings</button></nav><div id="message" role="status" aria-live="polite"></div><section id="view"><div class="empty">Connecting to your library…</div></section></main>
<dialog id="dialog"><button class="close" aria-label="Close">×</button><div id="dialog-content"></div></dialog>
<script>
'use strict';
const state={profile:null,tracking:[],releases:[],reviews:[],tab:'watching',results:[],query:'',busy:0,reading:false,version:0};
const labels={watching:'Keep the story going.',want:'For another night.',done:'The ones you’ve seen.',dropped:'Left behind.',upcoming:'Coming to your screen.',search:'Find your next watch.',settings:'Make it yours.'};
const tiers={loved:'Loved it',liked:'Liked it',fine:'It was fine',nah:'Not for me'};
const $=s=>document.querySelector(s);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function id(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
function rpc(body){return new Promise((resolve,reject)=>{if(!window.google?.script?.run){reject(new Error('Open this app from its deployed Apps Script URL.'));return}google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).watchTogetherApi(body)})}
function notice(text,error=false){$('#message').innerHTML=text?'<div class="notice '+(error?'error':'')+'">'+esc(text)+'</div>':''}
async function run(fn){state.busy++;state.version++;document.querySelectorAll('#view button').forEach(b=>b.disabled=true);try{const result=await fn();notice('Saved to your sheet.');return result}catch(e){notice(e.message||String(e),true);throw e}finally{state.busy--;if(!state.busy)render()}}
async function load(quiet=false){if(state.busy||state.reading)return;state.reading=true;const version=state.version;try{const data=await rpc({action:'bootstrap'});if(version!==state.version||state.busy)return;Object.assign(state,data);$('#account').textContent=state.profile.display_name+' · '+state.profile.email;if(!quiet||!['search','settings'].includes(state.tab))render()}catch(e){notice(e.message||String(e),true)}finally{state.reading=false}}
function title(row){return row.titles||row}
function nextEpisode(row){return (title(row).episode_data||[]).filter(e=>e.season_number>0).sort((a,b)=>a.season_number-b.season_number||a.episode_number-b.episode_number).find(e=>e.season_number>Number(row.last_season||1)||(e.season_number===Number(row.last_season||1)&&e.episode_number>Number(row.last_episode||0)))}
function today(){try{const parts=new Intl.DateTimeFormat('en',{timeZone:state.profile.timezone,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const part=t=>parts.find(p=>p.type===t).value;return part('year')+'-'+part('month')+'-'+part('day')}catch{return new Date().toISOString().slice(0,10)}}
function poster(t){return t.poster_path&&/^\/[a-zA-Z0-9_.-]+$/.test(t.poster_path)?'<img loading="lazy" class="poster" src="https://image.tmdb.org/t/p/w342'+esc(t.poster_path)+'" alt="'+esc(t.title)+' poster">':'<div class="poster placeholder">◷</div>'}
function card(row,index,search=false){const t=title(row),next=nextEpisode(row);let actions='';if(search){actions='<button data-add="'+index+'" data-status="want">+ Watchlist</button><button data-add="'+index+'" data-status="watching">Start watching</button><button data-add="'+index+'" data-status="done">Watched it</button>'}else{if(t.media_type==='tv'&&row.status==='watching'&&next?.air_date&&next.air_date<=today())actions+='<button class="primary" data-op="advance" data-id="'+row.title_id+'">Watched episode</button>';if(row.status!=='done')actions+='<button data-op="done" data-id="'+row.title_id+'">Watched it</button>';if(row.status==='want'||row.status==='dropped')actions+='<button data-op="watching" data-id="'+row.title_id+'">Start watching</button>';if(row.status==='done')actions+='<button data-rate="'+row.title_id+'">'+(row.tier?'Change rating':'Rate')+'</button>';actions+='<button data-detail="'+row.title_id+'">Details</button>'}return '<article class="card">'+poster(t)+'<div class="body"><h2>'+esc(t.title)+'</h2><div class="meta">'+esc(t.year||'')+' · '+(t.media_type==='tv'?'Series':'Film')+(t.runtime_min?' · '+t.runtime_min+' min':'')+'</div>'+(!search&&t.media_type==='tv'?'<p class="meta">Last watched: S'+Number(row.last_season||1)+' E'+Number(row.last_episode||0)+'<br>'+(next?'Next: S'+next.season_number+' E'+next.episode_number+(next.air_date&&next.air_date>today()?' · '+esc(next.air_date):''):'Caught up')+'</p>':'')+(row.tier?'<div class="tag">'+esc(tiers[row.tier])+' · '+Math.round(row.score*100)+'</div>':'')+'<div class="actions">'+actions+'</div></div></article>'}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));let html='<div class="toolbar"><div><h1>'+esc(labels[state.tab])+'</h1><p>Your library. Your pace.</p></div>'+(state.tab!=='search'&&state.tab!=='settings'?'<button data-refresh>Refresh</button>':'')+'</div>';if(state.tab==='search'){html+='<form class="search" id="search-form"><input name="query" aria-label="Search films and series" placeholder="Search films and series" value="'+esc(state.query)+'" required maxlength="200"><button class="primary">Search</button></form><div class="grid">'+state.results.map((r,i)=>card(r,i,true)).join('')+'</div>';if(state.query&&!state.results.length)html+='<p>No results yet. Try a title or a different spelling.</p>'}else if(state.tab==='settings'){html+=settings()}else if(state.tab==='upcoming'){const releases=state.releases.filter(r=>{const row=state.tracking.find(x=>x.title_id===r.title_id);return row&&row.follow!=='never'&&(row.follow==='always'||row.status==='watching')&&(r.season>row.last_season||r.season===row.last_season&&r.episode>row.last_episode)});html+=releases.length?releases.map(r=>'<div class="release"><strong>'+esc(r.air_date)+'</strong><div><b>'+esc(r.titles.title)+'</b><div class="meta">S'+r.season+' E'+r.episode+' · '+esc(r.episode_title)+'</div></div></div>').join(''):'<div class="empty">No upcoming episodes in the next 60 days.<p>Episode dates update when you refresh a show’s details.</p></div>'}else{const rows=state.tracking.filter(r=>r.status===state.tab).sort((a,b)=>state.tab==='done'?(Number(b.score||-1)-Number(a.score||-1)):String(b.updated_at).localeCompare(String(a.updated_at)));html+=rows.length?'<div class="grid">'+rows.map((r,i)=>card(r,i)).join('')+'</div>':'<div class="empty">A little room for a good story.<p>Search for a film or series to add it here.</p><button data-go-search class="primary">Find something to watch</button></div>'}$('#view').innerHTML=html;if(state.busy)document.querySelectorAll('#view button').forEach(b=>b.disabled=true)}
async function track(row,operation,payload={},candidate=null){const body={action:'track',operation,payload:{...payload,event_key:id()}};if(row)body.title_id=row.title_id;else Object.assign(body,{tmdb_id:candidate.tmdb_id,media_type:candidate.media_type});return run(async()=>{const saved=await rpc(body);state.tracking=state.tracking.filter(r=>r.title_id!==(row?.title_id||saved?.title_id));if(saved)state.tracking.push(saved);return saved})}
function modal(html){$('#dialog-content').innerHTML=html;if(!$('#dialog').open)$('#dialog').showModal()}
function detail(row){const t=title(row);const p=(t.providers||{})[state.profile.region]||{};const providers=[...new Set([...(p.flatrate||[]),...(p.free||[]),...(p.ads||[])].map(x=>x.provider_name))];modal('<h2>'+esc(t.title)+'</h2><p>'+esc(t.overview||'No overview available.')+'</p><p class="meta">'+esc((t.genres||[]).join(' · '))+'</p><p>Streaming: '+esc(providers.join(', ')||'No subscription availability listed for '+state.profile.region)+'</p>'+ (t.media_type==='tv'?'<form id="position-form" data-id="'+row.title_id+'"><h3>Last watched episode</h3><div class="comparison"><label>Season<input name="season" type="number" min="1" value="'+Number(row.last_season||1)+'" required></label><label>Episode<input name="episode" type="number" min="0" value="'+Number(row.last_episode||0)+'" required></label></div><button style="margin-top:12px">Save position</button></form><div class="field"><label>Upcoming episodes<select id="follow" data-id="'+row.title_id+'">'+['auto','always','never'].map(v=>'<option value="'+v+'" '+(row.follow===v?'selected':'')+'>'+({auto:'While watching',always:'Always show',never:'Hide'}[v])+'</option>').join('')+'</select></label></div>':'')+'<div class="actions"><button data-metadata="'+row.title_id+'">Refresh details</button><button data-op="dropped" data-id="'+row.title_id+'">Drop</button><button data-op="want" data-id="'+row.title_id+'">Move to watchlist</button><button data-op="remove" data-id="'+row.title_id+'">Remove from library</button></div><p class="fineprint">Availability and metadata provided by TMDB. This app is not endorsed or certified by TMDB.</p>')}
let ranking=null;
function rate(row){ranking={row};modal('<h2>How was '+esc(title(row).title)+'?</h2><p>Pick a feeling. A few comparisons will place it in your list.</p><div class="tier-buttons">'+Object.entries(tiers).map(([v,label])=>'<button data-tier="'+v+'">'+label+'</button>').join('')+'</div>')}
function compare(){const r=ranking;if(r.lo>=r.hi||r.comparisons.length===3){finishRating();return}r.mid=Math.floor((r.lo+r.hi)/2);const other=r.list[r.mid];modal('<h2>Which would you choose?</h2><p>Comparison '+(r.comparisons.length+1)+' of at most 3</p><div class="comparison"><button data-winner="new">'+esc(title(r.row).title)+'</button><button data-winner="other">'+esc(title(other).title)+'</button></div>')}
async function finishRating(){const r=ranking;const pos=Math.floor((r.lo+r.hi)/2);$('#dialog').close();try{await track(r.row,'rate',{tier:r.tier,comparisons:r.comparisons,after:r.list[pos-1]?.title_id??null,before:r.list[pos]?.title_id??null});await load(true)}catch{}}
function settings(){if(!state.profile)return '<p>Sign-in is required before loading settings.</p>';return '<div class="settings"><h2>Your preferences</h2><form id="profile-form"><div class="field"><label>Display name<input name="display_name" maxlength="80" value="'+esc(state.profile.display_name)+'" required></label></div><div class="comparison"><label>Country code<input name="region" maxlength="2" pattern="[A-Z]{2}" value="'+esc(state.profile.region)+'" required></label><label>Time zone<input name="timezone" value="'+esc(state.profile.timezone)+'" required></label></div><div class="field"><label>Streaming services</label><div class="services">'+['netflix','max','prime','apple','hulu','disney'].map(s=>'<label><input type="checkbox" name="services" value="'+s+'" '+(state.profile.streaming_services?.includes(s)?'checked':'')+'>'+esc(s)+'</label>').join('')+'</div></div><button class="primary">Save preferences</button></form><hr><h2>Import viewing history</h2><p>Upload a CSV with Title and Date columns. Optional columns: Service, Year, Season, Episode. Ambiguous matches go to review.</p><input id="csv" type="file" accept=".csv,text/csv" aria-label="Import CSV"><div id="import-progress" role="status"></div><h3>Match review ('+state.reviews.length+')</h3>'+state.reviews.map((r,i)=>'<div class="ranking"><b>'+esc(r.raw_string)+'</b><div class="actions">'+(r.candidates||[]).map((c,j)=>'<button data-review="'+i+'" data-candidate="'+j+'">'+esc(c.title)+' '+esc(c.year||'')+'</button>').join('')+'</div></div>').join('')+'<p class="fineprint">Hosted by Google Apps Script. Both accounts use the same private sheet; each account has its own library. Automatic Netflix logging and push notifications are not included. Google’s iframe hosting does not provide an installable offline PWA.</p></div>'}
function parseCSV(text){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field=''}else field+=c}if(quoted)throw new Error('CSV contains an unclosed quoted field');row.push(field);if(row.some(x=>x.trim()))rows.push(row);if(!rows.length)return [];const headers=rows.shift().map(x=>x.replace(/^\uFEFF/,'').trim().toLowerCase());const column=(r,names)=>r[headers.findIndex(x=>names.includes(x))]||'';if(!headers.includes('title'))throw new Error('CSV needs a Title column');return rows.map(r=>{const raw=column(r,['title']);const match=raw.match(/^(.*?)\s*:\s*(?:season|series)\s*(\d+)\s*:\s*(.*)$/i);return {title:raw,query:match?match[1]:raw,watched_at:column(r,['date','watched_at']),service:column(r,['service'])||'csv',year:Number(column(r,['year']))||null,season:Number(column(r,['season']))||(match?Number(match[2]):null),episode:Number(column(r,['episode']))||null}}).filter(r=>r.title.trim())}
async function importCSV(file){if(!file)return;if(file.size>2e6){notice('Choose a CSV under 2 MB.',true);return}try{const rows=parseCSV(await file.text());await run(async()=>{for(let i=0;i<rows.length;i+=5){$('#import-progress').textContent='Importing '+Math.min(i+5,rows.length)+' of '+rows.length;await rpc({action:'import',rows:rows.slice(i,i+5)})}});await load();notice('Import complete. Check match review for uncertain titles.')}catch(e){notice('Import stopped: '+e.message+' Completed rows remain saved.',true)}}
document.addEventListener('click',async event=>{const b=event.target.closest('button');if(!b)return;try{if(b.matches('.close')){$('#dialog').close();return}if(b.dataset.tab||b.hasAttribute('data-go-search')){state.tab=b.dataset.tab||'search';render();return}if(b.hasAttribute('data-refresh')){await load();return}if(b.dataset.add){const t=state.results[Number(b.dataset.add)];await track(null,'status',{status:b.dataset.status},t);return}if(b.dataset.op){const row=state.tracking.find(r=>r.title_id===Number(b.dataset.id));if(!row)return;const op=b.dataset.op;await track(row,['remove','advance'].includes(op)?op:'status',['remove','advance'].includes(op)?{}:{status:op});$('#dialog').close();return}if(b.dataset.detail){detail(state.tracking.find(r=>r.title_id===Number(b.dataset.detail)));return}if(b.dataset.rate){rate(state.tracking.find(r=>r.title_id===Number(b.dataset.rate)));return}if(b.dataset.tier){Object.assign(ranking,{tier:b.dataset.tier,list:state.tracking.filter(r=>r.tier===b.dataset.tier&&r.title_id!==ranking.row.title_id).sort((a,b)=>a.rank_pos-b.rank_pos||a.title_id-b.title_id),lo:0,comparisons:[]});ranking.hi=ranking.list.length;compare();return}if(b.dataset.winner){const r=ranking,o=r.list[r.mid];r.comparisons.push({other:o.title_id,winner:b.dataset.winner==='new'?r.row.title_id:o.title_id});if(b.dataset.winner==='new')r.hi=r.mid;else r.lo=r.mid+1;compare();return}if(b.dataset.metadata){await run(()=>rpc({action:'refresh-metadata',title_ids:[Number(b.dataset.metadata)]}));$('#dialog').close();await load();return}if(b.dataset.review){const review=state.reviews[Number(b.dataset.review)],candidate=review.candidates[Number(b.dataset.candidate)];await run(()=>rpc({action:'review',id:review.id,tmdb_id:candidate.tmdb_id,media_type:candidate.media_type}));await load();return}}catch{}});
document.addEventListener('submit',async event=>{event.preventDefault();const f=event.target,form=new FormData(f);try{if(f.id==='search-form'){state.query=String(form.get('query'));const q=state.query;notice('Searching…');const results=await rpc({action:'search',query:q});if(state.query===q){state.results=results;notice('');if(state.tab==='search')render()}}else if(f.id==='profile-form'){await run(async()=>{state.profile=await rpc({action:'profile',request_id:id(),profile:{display_name:form.get('display_name'),region:String(form.get('region')).toUpperCase(),timezone:form.get('timezone'),streaming_services:form.getAll('services')}})});$('#account').textContent=state.profile.display_name+' · '+state.profile.email}else if(f.id==='position-form'){const row=state.tracking.find(r=>r.title_id===Number(f.dataset.id));await track(row,'position',{season:Number(form.get('season')),episode:Number(form.get('episode'))});$('#dialog').close()}}catch(e){notice(e.message||String(e),true)}});
document.addEventListener('change',async event=>{try{if(event.target.id==='csv')await importCSV(event.target.files[0]);if(event.target.id==='follow'){const row=state.tracking.find(r=>r.title_id===Number(event.target.dataset.id));await track(row,'follow',{follow:event.target.value})}}catch{}});
setInterval(()=>{if(document.visibilityState==='visible'&&!$('#dialog').open)load(true)},20000);window.addEventListener('focus',()=>load(true));load();
</script></body></html>
